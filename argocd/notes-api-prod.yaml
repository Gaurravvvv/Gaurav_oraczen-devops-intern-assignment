apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes-api-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Gaurravvvv/Gaurav_oraczen-devops-intern-assignment.git
    targetRevision: main
    path: helm/notes-api
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: notes-prod
  syncPolicy:
    automated:
      prune: false     # Prevent accidental resource deletion in prod
      selfHeal: true   # Auto-revert drift back to git state
    syncOptions:
      - CreateNamespace=true
